<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #p, iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div id="p"></div>
<script>
  // Served from http://127.0.0.1:<port> so the YouTube embed gets a real
  // HTTP referer (tauri://localhost sends none → error 153). The host app
  // drives playback over postMessage; sync getters on the app side read
  // the periodic "snap" snapshots this page pushes back.
  var videoId = new URLSearchParams(location.search).get("v") || "";
  var player = null;
  var ready = false;

  function post(msg) {
    parent.postMessage(msg, "*");
  }

  function snap() {
    if (!ready) return;
    post({
      type: "snap",
      time: player.getCurrentTime(),
      rate: player.getPlaybackRate(),
      title: (player.getVideoData() || {}).title || "",
      state: player.getPlayerState(),
    });
  }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("p", {
      videoId: videoId,
      width: "100%",
      height: "100%",
      playerVars: { rel: 0, modestbranding: 1, enablejsapi: 1, origin: location.origin },
      events: {
        onReady: function () {
          ready = true;
          post({ type: "ready" });
          snap();
        },
        onStateChange: function (e) {
          post({ type: "state", data: e.data });
          snap();
        },
      },
    });
  };

  setInterval(snap, 200);

  window.addEventListener("message", function (e) {
    if (!ready || !e.data || e.source !== parent) return;
    var v = e.data.value;
    switch (e.data.cmd) {
      case "play": player.playVideo(); break;
      case "pause": player.pauseVideo(); break;
      case "seek": player.seekTo(v, true); snap(); break;
      case "rate": player.setPlaybackRate(v); break;
      case "cue": player.cueVideoById(v); break;
      case "mute": player.mute(); break;
    }
  });

  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
</script>
</body>
</html>
